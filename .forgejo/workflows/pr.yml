name: Pull Request

on:
  pull_request:
    paths-ignore:
      - "*.md"

jobs:
  pr:
    runs-on: debian-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup JDK 17
        # §75: v3 kırıldı — android-actions issue #537 (`tools` paketi deprecate)
        # ve #536 (commandlinetools URL 404). v4 = maintainer cmdline-tools yolu.
        uses: https://github.com/android-actions/setup-android@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: Setup Android SDK
        uses: https://github.com/android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build Plugins
        run: |
          ./gradlew make makePluginsJson
